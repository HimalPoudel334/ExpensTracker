[package]
name = "expensetracker-notify"
version = "0.1.0"
edition = "2021"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls", "json"], default-features = false }
jsonwebtoken = "9"
chrono = "0.4"
anyhow = "1"
log = "0.4"
dotenvy = "0.15"
url = "=2.4.1"
time = "=0.3.36"
windows-service = "0.8.1"
flexi_logger = "0.31.10"
